[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcus"
version = "0.1.0"
description = "Arcus — a from-scratch MoDE (Mixture-of-Depths + Experts) foundation model on a modern transformer backbone, with a tiktoken tokenizer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "William McKeon" }]
dependencies = [
    "torch>=2.7.0",
    "tiktoken>=0.7.0",
    "zstandard>=0.22.0",
    "tqdm>=4.65",
    "huggingface_hub>=0.20",
    "safetensors>=0.4.0",
    "numpy>=1.26",
    "pytest>=8.0",
]

[project.optional-dependencies]
# The archived Qwen-wrapper path under legacy/.
legacy = [
    "transformers>=5.0.0",
    "accelerate>=0.30.0",
    "datasets>=2.18.0",
    "tokenizers>=0.19.0",
    "safetensors>=0.4.0",
]

[tool.setuptools]
packages = ["arcus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
