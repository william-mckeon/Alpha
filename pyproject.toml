[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcus"
version = "0.1.0"
description = "Arcus MoDE research: a preserved from-scratch track and a permissive coding-MoE donor-conversion track."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "William McKeon" }]
dependencies = [
    # torch is a PLATFORM-SPECIFIC prerequisite — install it FIRST for your GPU/driver, never via
    # this list. A ">=" pin can't be right for every box and would upgrade a pod's CUDA-matched
    # torch to an incompatible build (-> silent device=cpu fallback). See requirements.txt.
    # `pip install -e .` therefore does NOT pull torch; the pod flow also uses `--no-deps`.
    "tiktoken>=0.7.0",
    "zstandard>=0.22.0",
    "tqdm>=4.65",
    "huggingface_hub>=0.20",
    "safetensors>=0.4.0",
    "numpy>=1.26",
    "pytest>=8.0",
]

[project.optional-dependencies]
baby = [] # Torch is a separate platform prerequisite; CPU services remain stdlib-only.
desktop = ["PySide6==6.10.2", "Pillow==12.1.0", "windows-capture==2.0.1; sys_platform == 'win32'"]
evaluation = [
    "mcp==1.26.0",
    "httpx==0.28.1",
    "jsonschema==4.26.0",
]
# Footprint levers (specs/0007) for the cloud L40S run: 8-bit AdamW (+ optional fused-CE kernel).
# Deliberately NOT in base — bitsandbytes/triton are patchy on the 5080/Blackwell (sm_120).
# Install only on the L40S:  pip install -e ".[cloud]"
cloud = [
    "bitsandbytes>=0.43.0",
    # "cut-cross-entropy",   # optional fused linear-CE kernel; arcus/loss.py has a torch fallback
]
# Laptop-side tools to SUBMIT the SageMaker training job (launch.py). Pin the SDK to v2 — v3
# is a rewrite that restructured `sagemaker.pytorch.PyTorch` (the Estimator API launch.py uses)
# away. Install alongside the AWS CLI v2 (installed separately via the MSI):
#   pip install -e ".[launch]"
launch = [
    "sagemaker>=2.200,<3",
    "boto3>=1.34.0",
]
# The archived Qwen-wrapper path under legacy/.
legacy = [
    "transformers>=5.0.0",
    "accelerate>=0.30.0",
    "datasets>=2.18.0",
    "tokenizers>=0.19.0",
    "safetensors>=0.4.0",
]

[project.scripts]
baby-arcus = "baby_arcus.cli:main"
arcus-desktop = "baby_arcus.desktop:main"

[tool.setuptools]
packages = ["arcus", "evaluation", "baby_arcus", "baby_arcus.services"]

[tool.setuptools.package-data]
baby_arcus = ["web/*.html", "web/*.js", "web/*.css", "web/*.png"]
evaluation = ["*.json", "harnesses/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
