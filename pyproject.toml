[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arcus"
version = "0.1.0"
description = "Arcus — a from-scratch MoDE (Mixture-of-Depths + Experts) foundation model on a modern transformer backbone, with a tiktoken tokenizer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "William McKeon" }]
dependencies = [
    "torch>=2.7.0",
    "tiktoken>=0.7.0",
    "zstandard>=0.22.0",
    "tqdm>=4.65",
    "huggingface_hub>=0.20",
    "safetensors>=0.4.0",
    "numpy>=1.26",
    "pytest>=8.0",
]

[project.optional-dependencies]
# Footprint levers (specs/0007) for the cloud L40S run: 8-bit AdamW (+ optional fused-CE kernel).
# Deliberately NOT in base — bitsandbytes/triton are patchy on the 5080/Blackwell (sm_120).
# Install only on the L40S:  pip install -e ".[cloud]"
cloud = [
    "bitsandbytes>=0.43.0",
    # "cut-cross-entropy",   # optional fused linear-CE kernel; arcus/loss.py has a torch fallback
]
# Laptop-side tools to SUBMIT the SageMaker training job (launch.py). Pin the SDK to v2 — v3
# is a rewrite that restructured `sagemaker.pytorch.PyTorch` (the Estimator API launch.py uses)
# away. Install alongside the AWS CLI v2 (installed separately via the MSI):
#   pip install -e ".[launch]"
launch = [
    "sagemaker>=2.200,<3",
    "boto3>=1.34.0",
]
# The archived Qwen-wrapper path under legacy/.
legacy = [
    "transformers>=5.0.0",
    "accelerate>=0.30.0",
    "datasets>=2.18.0",
    "tokenizers>=0.19.0",
    "safetensors>=0.4.0",
]

[tool.setuptools]
packages = ["arcus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
